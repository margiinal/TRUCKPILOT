<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031321"><title>MYTRUCK MATE — Ma journée</title>
<style>
:root{--bg:#031321;--panel:#06243a;--panel2:#092c46;--cyan:#16d5ff;--cyan2:#00a9e8;--white:#f5fbff;--muted:#b9d6e7;--line:#087da8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#124363 0,#031321 58%);color:var(--white);font-family:Arial,Helvetica,sans-serif}
.page{width:min(100%,1040px);margin:auto;padding:10px 18px 26px}
nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 10px;color:#18d8ff;font-size:16px;font-weight:800}nav a{color:inherit;text-decoration:none}nav .crumb{color:#fff}
.hero{height:174px;background:url('assets/3d/ma-journee-bandeau-fourni.svg') center/cover no-repeat;border-radius:15px;margin:0 0 12px;box-shadow:0 0 24px #00bfff24;border:1px solid #12648b}
.panel{border:1px solid #087fae;border-radius:18px;background:linear-gradient(145deg,#06263d,#041a2b);margin:10px 0;overflow:hidden;box-shadow:0 6px 22px #0005,inset 0 1px #ffffff13}
.panel-head{height:43px;display:flex;align-items:center;gap:12px;padding:0 18px;background:linear-gradient(90deg,#075b83,#087eae 52%,#06446a);font-size:22px;font-weight:900;text-shadow:0 1px 4px #001522}
.ico{width:30px;height:30px;flex:none;color:#c9f5ff}
.panel-body{padding:12px 18px 14px}
.identity{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.field{min-width:0}.field label{display:block;font-size:15px;font-weight:800;margin:0 0 5px 2px;color:#f2faff}
.field input,.field select{width:100%;height:45px;border:1px solid #5a9ab8;border-radius:9px;background:linear-gradient(100deg,#061a2b,#092a41);color:#fff;padding:0 13px;font-size:17px;font-weight:700;outline:none;min-width:0}
.field input:focus,.field select:focus{border-color:#1bdcff;box-shadow:0 0 0 2px #00bfff30}
.locrow{display:grid;grid-template-columns:54px 1fr 1.3fr;align-items:center;gap:12px;padding:11px 18px}.locrow .pin{font-size:32px;text-align:center;color:#28dfff}.locrow label{font-size:18px;font-weight:800}.locrow input{height:40px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid #1687b4;border-radius:13px;background:linear-gradient(145deg,#061c2e,#082c44);padding:9px 5px;text-align:center;min-width:0}
.stat label{display:block;font-size:16px;font-weight:700;margin-bottom:5px}.stat strong{font-size:22px;display:block;white-space:nowrap}.stat.accent label,.stat.accent strong{color:#1be0ff}
.kmstats{grid-template-columns:repeat(3,minmax(0,1fr))}
.transports{padding:9px 18px 12px}
.transport{border:1px solid #13c7ef;border-radius:15px;background:linear-gradient(120deg,#082b44,#061b2c);padding:10px 14px 12px;margin:5px 0 12px}
.transport-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.transport-head b{background:linear-gradient(90deg,#27ddff,#079ed7);color:#00243a;border-radius:13px;padding:4px 19px;font-size:18px}
.transport-head button{border:1px solid #247b9d;background:#062237;color:#aeeeff;border-radius:8px;padding:5px 10px}
.transport-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.transport-grid .field label{font-size:12px;color:#cce7f5}
.transport-grid .field input,.transport-grid .field select{height:37px;font-size:14px;padding:0 9px}
.fees{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:10px 14px 14px}
.fee{border:1px solid #2185ac;border-radius:13px;background:linear-gradient(145deg,#061d2e,#08283f);padding:9px 5px 10px;text-align:center;min-width:0}
.fee .symbol{font-size:27px;line-height:1.15;color:#bdefff}.fee label{display:block;font-size:14px;font-weight:800;margin:5px 0 10px;white-space:nowrap}
.choices{display:flex;gap:5px;justify-content:center}.choices label{border:1px solid #69b5d3;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:800;cursor:pointer;margin:0;min-width:55px}
.choices input{position:absolute;opacity:0;pointer-events:none}.custom-count{display:flex;justify-content:center}.custom-count input{width:76px;height:36px;border:1px solid #69b5d3;border-radius:8px;background:#061d2e;color:#fff;text-align:center;font-size:16px;font-weight:800;padding:0 6px;opacity:1;position:static;pointer-events:auto}.choices label:has(input:checked){background:linear-gradient(#27dfff,#079bdb);color:#00283d;border-color:#a5f3ff;box-shadow:0 0 10px #00cfff66}
.actions{padding:13px 4px 3px}.save{width:100%;min-height:62px;border:2px solid #70ecff;border-radius:16px;background:linear-gradient(180deg,#6ce7ff,#06aee8);color:#00263a;font-size:23px;font-weight:900;box-shadow:0 0 18px #00bfff66,inset 0 2px #ffffff9c;cursor:pointer}
.status{min-height:19px;text-align:center;color:#86e8b1;font-size:13px;margin-top:8px}.smallnote{color:#8eafc4;font-size:11px;text-align:center;margin:6px 0 0}
.add{border:1px solid #1c8bb4;background:#082a42;color:#c8f5ff;border-radius:9px;padding:9px 14px;font-weight:800}
@media print{body{background:#fff!important;color:#111!important}.page{width:100%;max-width:none;padding:0;margin:0}.hero{box-shadow:none;border:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}.panel{break-inside:avoid;background:#fff!important;color:#111!important;border:1px solid #777;box-shadow:none}.panel-head{background:#e8f3f8!important;color:#111!important;text-shadow:none}.field label,.locrow label,.stat label,.fee label,.transport-grid .field label{color:#111!important}.field input,.field select,.locrow input{background:#fff!important;color:#111!important;border:1px solid #777!important;-webkit-text-fill-color:#111!important}.stat,.fee,.transport{background:#fff!important;color:#111!important;box-shadow:none;border:1px solid #999}.stat strong{color:#111!important}.choices label{color:#111!important;border-color:#777}.choices label:has(input:checked){background:#e8f3f8!important;color:#111!important;box-shadow:none}.choices input{position:static;opacity:1;pointer-events:none}.actions,nav,.add,.remove{display:none!important}}\n@media(max-width:650px){.page{padding:5px 8px 20px}nav{height:34px;font-size:14px}.hero{height:145px;background-position:center}.panel{border-radius:14px;margin:8px 0}.panel-head{height:37px;font-size:18px;padding:0 12px}.panel-body{padding:9px 10px 11px}.identity{gap:6px}.field label{font-size:12px}.field input,.field select{height:40px;font-size:14px;padding:0 8px}.locrow{grid-template-columns:34px 1fr;gap:7px;padding:9px 10px}.locrow .pin{font-size:25px}.locrow label{font-size:14px}.locrow input{grid-column:2;height:37px}.stats{gap:6px}.stat{padding:8px 2px}.stat label{font-size:11px}.stat strong{font-size:16px}.transports{padding:8px 9px}.transport{padding:9px;margin-bottom:9px}.transport-head b{font-size:14px;padding:4px 13px}.transport-grid{gap:6px 8px}.transport-grid .field label{font-size:10px}.transport-grid .field input,.transport-grid .field select{height:35px;font-size:12px}.fees{gap:5px;padding:8px 6px 10px}.fee{padding:7px 2px}.fee .symbol{font-size:21px}.fee label{font-size:10px;margin:4px 0 8px}.choices{gap:3px}.choices label{min-width:0;padding:5px 7px;font-size:11px}.save{min-height:55px;font-size:18px}.ico{width:25px;height:25px}}
@media(max-width:380px){.stat strong{font-size:14px}.transport-grid{grid-template-columns:1fr 1fr}.fees{gap:3px}.choices label{padding:5px 5px}}
</style></head>
<body><main class="page">
<nav><a href="index.html">← Accueil</a><span>›</span><span class="crumb">Ma journée</span></nav>
<div class="hero" role="img" aria-label="MYTRUCK MATE — Ma journée, camion sur une route au coucher du soleil"></div>
<section class="panel"><div class="panel-body identity">
<div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
<div class="field"><label for="tractor">Immatriculation</label><input id="tractor" list="plates" placeholder="Ex. FN-769-YY"></div>
</div></section>
<section class="panel locrow"><div class="pin">📍</div><label for="place">Lieux fin de journée</label><input id="place" placeholder="Ville / lieu"></section>
<section class="panel"><div class="panel-head"><span class="ico">◷</span> Horaires et activité</div><div class="panel-body stats">
<div class="field stat"><label for="start">Début</label><input id="start" type="time"></div>
<div class="field stat"><label for="end">Fin</label><input id="end" type="time"></div>
<div class="stat accent"><label>Amplitude</label><strong id="amplitude">—</strong></div>
<div class="field stat"><label for="drive">Conduite</label><input id="drive" type="time"></div>
</div></section>
<section class="panel"><div class="panel-head"><span class="ico">ⓚ</span> Kilométrage</div><div class="panel-body stats kmstats">
<div class="field stat"><label for="kmstart">Km départ</label><input id="kmstart" type="number" inputmode="numeric" placeholder="0"></div>
<div class="field stat"><label for="kmend">Km arrivée</label><input id="kmend" type="number" inputmode="numeric" placeholder="0"></div>
<div class="stat accent"><label>Total</label><strong id="distance">— km</strong></div>
</div></section>
<section class="panel"><div class="panel-head"><span class="ico">🚚</span> Transports (<span id="transportCount">2</span>)</div><div class="transports"><div id="transports"></div><button class="add" id="addTransport" type="button">＋ Ajouter un transport</button></div></section>
<section class="panel"><div class="panel-head"><span class="ico">♜</span> Frais de route et repas</div><div class="fees">
<div class="fee"><div class="symbol">☕</div><label>Petit-déjeuner</label><div class="choices"><label><input type="radio" name="breakfast" value="yes">Oui</label><label><input type="radio" name="breakfast" value="no" checked>Non</label></div></div>
<div class="fee"><div class="symbol">♧</div><label>Déjeuner</label><div class="choices"><label><input type="radio" name="lunch" value="yes">Oui</label><label><input type="radio" name="lunch" value="no" checked>Non</label></div></div>
<div class="fee"><div class="symbol">🍽</div><label>Dîner</label><div class="choices"><label><input type="radio" name="dinner" value="yes">Oui</label><label><input type="radio" name="dinner" value="no" checked>Non</label></div></div>
<div class="fee"><div class="symbol">🛏</div><label>Nuit</label><div class="choices"><label><input type="radio" name="night" value="yes">Oui</label><label><input type="radio" name="night" value="no" checked>Non</label></div></div>
<div id="customFeeCards" style="display:contents"></div>
</div></section>
<div class="actions"><button class="save" id="save" type="button">✓ Enregistrer la journée</button><div class="status" id="status"></div><p class="smallnote">Enregistrement automatique sur cet appareil et synchronisation avec votre compte.</p></div>
<datalist id="plates"><option>FN-769-YY</option></datalist>
<datalist id="donors"><option>LPO Sogena</option><option>TFS France</option><option>TBI</option><option>Seyris</option><option>Tps Louis</option><option>Atlas Transit</option></datalist>
<datalist id="clients"><option>Tang Frères</option><option>BARIAU</option><option>LAD</option></datalist>
<datalist id="sizes"><option>20 D</option><option>20 HC</option><option>20 RE</option><option>20 OT</option><option>40 D</option><option>40 HC</option><option>40 RE</option><option>40 OT</option></datalist>
<datalist id="chassis"><option>EQ 531 FL</option><option>EQ 647 FL</option><option>FR 653 SE</option></datalist>
</main>
<script>
const KEY='truckpilote_daily_entries_v1', $=id=>document.getElementById(id);
function makeTransport(data={}){const n=document.querySelectorAll('.transport').length+1;const box=document.createElement('div');box.className='transport';box.innerHTML='<div class="transport-head"><b>Transport '+n+'</b><button type="button" class="remove">Supprimer</button></div><div class="transport-grid">'+
'<div class="field"><label>Donneur d’ordre</label><input data-f="donor" list="donors" placeholder="Donneur d’ordre"></div>'+
'<div class="field"><label>Conteneur</label><input data-f="container" placeholder="N° conteneur"></div>'+
'<div class="field"><label>Client</label><input data-f="client" list="clients" placeholder="Client"></div>'+
'<div class="field"><label>Lieu du client</label><input data-f="city" placeholder="Ville / département"></div>'+
'<div class="field"><label>Plomb</label><input data-f="seal" placeholder="N° plomb"></div>'+
'<div class="field"><label>Châssis</label><input data-f="chassis" list="chassis" placeholder="N° châssis"></div>'+
'<div class="field"><label>Taille</label><input data-f="size" list="sizes" placeholder="Taille"></div>'+
'<div class="field"><label>Import / Export</label><select data-f="io"><option value="">Choisir</option><option>Import</option><option>Export</option></select></div></div>';
box.querySelectorAll('[data-f]').forEach(el=>el.value=data[el.dataset.f]||'');box.querySelector('.remove').onclick=()=>{box.remove();renumber()};$('transports').appendChild(box);renumber()}
function renumber(){const cards=[...document.querySelectorAll('.transport')];cards.forEach((b,i)=>b.querySelector('.transport-head b').textContent='Transport '+(i+1));$('transportCount').textContent=cards.length}
function radio(name){return document.querySelector('input[name="'+name+'"]:checked')?.value==='yes'}
let customPrimeConfig=[];function renderCustomFees(counts={}){const host=$('customFeeCards');if(!host)return;host.innerHTML='';customPrimeConfig.filter(p=>p.enabled&&p.name).forEach(p=>{const card=document.createElement('div');card.className='fee';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent='＋';const label=document.createElement('label');label.textContent=p.name+' ('+Number(p.rate||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €)';const wrap=document.createElement('div');wrap.className='custom-count';const input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.id='count-'+p.id;input.placeholder='0';input.value=counts[p.id]??0;input.style.width='76px';input.style.textAlign='center';wrap.append(input);card.append(symbol,label,wrap);host.append(card)})}window.setCustomPrimeConfig=config=>{customPrimeConfig=Array.isArray(config)?config:[];renderCustomFees({})};
function setRadio(name,value){const el=document.querySelector('input[name="'+name+'"][value="'+(value?'yes':'no')+'"]');if(el)el.checked=true}
function read(){const customPrimeCounts={},customPrimeRates={};customPrimeConfig.filter(p=>p.enabled&&p.name).forEach(p=>{const count=Math.max(0,Math.floor(Number(document.getElementById('count-'+p.id)?.value)||0));customPrimeCounts[p.id]=count;customPrimeRates[p.id]={name:p.name,rate:p.rate}});return {date:$('date').value,tractor:$('tractor').value,place:$('place').value,start:$('start').value,end:$('end').value,drive:$('drive').value,kmstart:$('kmstart').value,kmend:$('kmend').value,breakfast:radio('breakfast'),lunch:radio('lunch'),dinner:radio('dinner'),night:radio('night'),train:false,customPrimeCounts,customPrimeRates,transports:[...document.querySelectorAll('.transport')].map(b=>Object.fromEntries([...b.querySelectorAll('[data-f]')].map(el=>[el.dataset.f,el.value])))}}
function entries(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function load(e){if(!e)return;['date','tractor','place','start','end','drive','kmstart','kmend'].forEach(k=>{if($(k))$(k).value=e[k]??''});['breakfast','lunch','dinner','night'].forEach(k=>setRadio(k,!!e[k]));renderCustomFees(e.customPrimeCounts||{});$('transports').innerHTML='';(e.transports?.length?e.transports:[{},{}]).forEach(makeTransport);updateStats()}
function updateStats(){const a=$('kmstart').value,b=$('kmend').value;$('distance').textContent=a!==''&&b!==''&&Number(b)>=Number(a)?(Number(b)-Number(a)).toLocaleString('fr-FR')+' km':'— km';const s=$('start').value,e=$('end').value;if(!s||!e){$('amplitude').textContent='—';return}let [h1,m1]=s.split(':').map(Number),[h2,m2]=e.split(':').map(Number),n=h2*60+m2-h1*60-m1;if(n<0)n+=1440;$('amplitude').textContent=Math.floor(n/60)+' h '+String(n%60).padStart(2,'0')}
window.loadDailyEntry=load;
function clearForm(){['tractor','place','start','end','drive','kmstart','kmend'].forEach(k=>$(k).value='');['breakfast','lunch','dinner','night'].forEach(k=>setRadio(k,false));renderCustomFees({});$('transports').innerHTML='';makeTransport();makeTransport();updateStats()}
const params=new URLSearchParams(location.search),historyMode=params.get('mode')==='history',requestedDate=params.get('date');
$('date').value=requestedDate||new Date().toISOString().slice(0,10);makeTransport();makeTransport();
$('addTransport').onclick=()=>makeTransport();
['kmstart','kmend','start','end'].forEach(k=>$(k).addEventListener('input',updateStats));
$('date').addEventListener('change',()=>{const e=entries()[$('date').value];if(e)load(e);else clearForm()});
const current=entries()[$('date').value];if(current)load(current);
$('save').onclick=()=>{const e=read();if(!e.date){$('status').textContent='Choisissez une date.';return}const all=entries(),previous=all[e.date];let rates={breakfast:8.87,lunch:16.36,dinner:16.36,night:52.31};try{rates={...rates,...JSON.parse(localStorage.getItem('truckpilote_fee_rates_v1')||'{}')}}catch{}e.feeRates=previous?.feeRates||rates;all[e.date]=e;localStorage.setItem(KEY,JSON.stringify(all));$('status').textContent='Journée enregistrée ✓';window.dispatchEvent(new CustomEvent('truckpilote:daily-saved',{detail:e}));};
if(historyMode){document.querySelectorAll('input,select').forEach(el=>el.disabled=true);$('addTransport').hidden=true;document.querySelectorAll('.remove').forEach(el=>el.hidden=true);$('save').textContent='▣ Imprimer / Enregistrer en PDF';$('save').onclick=()=>location.href='detail_journee.html?date='+encodeURIComponent(requestedDate||$('date').value)+'&autoprint=1';$('status').textContent='Consultation de la journée enregistrée — mode lecture seule. Utilisez le bouton ci-dessous pour imprimer ou enregistrer en PDF.';}
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const LOCAL_KEY='truckpilote_daily_entries_v1';
const supabase=createClient('https://ahgdzxgowadoehqhlmqa.supabase.co','sb_publishable_Oja8VvG-iIv-mTKoz3Nicw_R9EnJG9P');
const status=document.getElementById('status');
const isMeaningful=e=>{if(!e||typeof e!=='object')return false;const fields=['tractor','place','start','end','drive','kmstart','kmend'];if(fields.some(k=>String(e[k]??'').trim()!==''))return true;if(['breakfast','lunch','dinner','night','train'].some(k=>e[k]===true))return true;if(Object.values(e.customPrimeCounts||{}).some(v=>Number(v)>0))return true;return Array.isArray(e.transports)&&e.transports.some(t=>t&&Object.values(t).some(v=>String(v??'').trim()!==''))};
async function getUser(){const {data:{user},error}=await supabase.auth.getUser();if(error)throw error;if(!user)throw new Error('Connexion nécessaire : retournez à l’accueil et connectez-vous.');return user}
window.addEventListener('truckpilote:daily-saved',async event=>{const e=event.detail;try{const user=await getUser();if(!isMeaningful(e)){status.textContent='Journée vide enregistrée localement.';return}const {error}=await supabase.from('truckpilote_daily_entries').upsert({user_id:user.id,work_date:e.date,entry:e,updated_at:new Date().toISOString()},{onConflict:'user_id,work_date'});if(error)throw error;status.textContent='Journée enregistrée et synchronisée en ligne ✓'}catch(error){status.textContent='Sauvegarde locale conservée. Synchronisation impossible : '+(error.message||'erreur réseau')}});
async function sync(){try{const user=await getUser();const {data,error}=await supabase.from('truckpilote_daily_entries').select('work_date,entry').eq('user_id',user.id).order('work_date',{ascending:true});if(error)throw error;const local=(()=>{try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')}catch{return {}}})();const merged={...local};(data||[]).forEach(row=>{if(isMeaningful(row.entry))merged[row.work_date]=row.entry});localStorage.setItem(LOCAL_KEY,JSON.stringify(merged));const selected=document.getElementById('date').value;if(merged[selected]&&isMeaningful(merged[selected]))window.loadDailyEntry?.(merged[selected]);status.textContent='Synchronisation terminée ✓'}catch(error){status.textContent='Données locales conservées. Synchronisation en attente.'}}

try{const {data:{user}}=await supabase.auth.getUser();window.setCustomPrimeConfig(user?.user_metadata?.custom_primes||[])}catch{}
await sync();
</script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script>
</body></html>
