<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061626"><title>MY TRUCK MATE — Détail de la journée</title>
<style>
:root{color-scheme:dark;--bg:#031321;--panel:#06243a;--line:#17658a;--cyan:#16c9f4;--ink:#f4faff;--muted:#b5d0e1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#0b3855 0,#031321 62%);color:var(--ink);font:14px Inter,system-ui,Arial,sans-serif;min-height:100vh;padding:10px}
main{width:min(100%,480px);margin:0 auto;border:2px solid #a9b8c2;border-radius:25px;padding:10px 11px 12px;background:linear-gradient(180deg,#031b2d,#041827 65%,#021321);box-shadow:0 0 0 2px #000,0 8px 28px #0009}
nav{height:30px;display:flex;align-items:center;gap:8px;color:#25d5ff;font-weight:750;font-size:14px;padding:0 7px}nav a{color:#20d8ff;text-decoration:none}.crumb{color:#d6f4ff}
.hero{height:76px;background:linear-gradient(90deg,#03182744,#03182700),url('assets/3d/ma-journee-bandeau-fourni.svg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid #17658a;margin:0 -1px 5px}
.hero strong{font-size:clamp(20px,5vw,25px);font-style:italic;font-weight:950;text-shadow:0 2px 8px #000}.hero small{display:block;font-size:14px;font-weight:750;letter-spacing:.4px}
.date{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:850;padding:5px 8px 9px}.date svg{width:23px;flex:none;color:#7de8ff}
.identity{display:flex;justify-content:space-between;gap:8px;align-items:center;background:linear-gradient(100deg,#0b3856,#041b2e);border:1px solid #1a7098;border-radius:11px;padding:10px 12px;margin-bottom:9px;font-size:12px}.identity span{display:flex;align-items:center;gap:7px}.identity b{font-size:12px}
.section{margin:8px 0 9px;border:1px solid #0e557a;border-radius:12px;background:linear-gradient(180deg,#07314c,#041b2d);overflow:hidden;box-shadow:inset 0 1px #ffffff12}
.heading{height:25px;padding:3px 9px;background:linear-gradient(90deg,#0876a7,#03466e);font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}.heading svg{width:18px;height:18px}
.metrics{display:grid;gap:5px;padding:6px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric{min-width:0;border:1px solid #17658a;border-radius:9px;background:linear-gradient(145deg,#05253b,#031726);text-align:center;padding:7px 2px 6px;min-height:46px}.metric label{display:block;color:#d7eaf5;font-size:11px;white-space:nowrap}.metric strong{display:block;font-size:16px;font-weight:900;margin-top:2px;white-space:nowrap}.metric .accent{color:#1de0ff}
.transport{margin:6px;padding:7px 8px;border:1px solid #1b739b;border-radius:10px;background:linear-gradient(120deg,#06263d,#031827)}.transport-title{display:inline-block;background:linear-gradient(90deg,#26d6ff,#0798d3);color:#002238;border-radius:7px;padding:2px 12px;font-weight:950;font-size:13px;margin-bottom:5px}
.transport-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:4px 7px}.transport-line{display:flex;align-items:center;gap:7px;min-width:0;font-size:11px;line-height:1.3;overflow-wrap:anywhere}.transport-line svg{width:14px;height:14px;flex:none;color:#cceeff}.transport-line b{font-weight:850}
.fees{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px}.fee{border:1px solid #1c688e;border-radius:9px;background:linear-gradient(145deg,#05253b,#031726);text-align:center;padding:5px 1px 4px;min-width:0}.fee svg{width:19px;height:19px;color:#aeeaff;display:block;margin:0 auto 3px}.fee label{font-size:10px;display:block;white-space:nowrap}.fee b{display:block;font-size:13px;margin-top:2px}.fee.yes b,.fee.yes svg{color:#39f18b}
.actions{display:flex;gap:9px;padding:3px 4px 0}.print{flex:1;border:0;border-radius:9px;background:linear-gradient(180deg,#53ddff,#08a6df);color:#00263a;font-weight:950;font-size:15px;padding:10px;box-shadow:0 3px 0 #00618c}.more{width:43px;border:1px solid #247da1;border-radius:9px;background:#031c2d;color:#a9eaff;font-size:20px}
.empty{color:#b6d6e8;text-align:center;padding:28px 15px}.empty a{color:#32d8ff}
@media(max-width:390px){body{padding:4px}main{padding:8px;border-radius:19px}.date{font-size:16px}.metric label{font-size:9px}.metric strong{font-size:14px}.transport-line{font-size:10px}.fee label{font-size:9px}.fee b{font-size:12px}}
@media print{body{background:#fff;padding:0;color:#fff}main{width:100%;max-width:480px;margin:0 auto;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}.actions,nav .back{display:none!important}}
</style></head><body><main>
<nav><a class="back" href="index.html">←</a><a href="historique.html">Historique</a><span>›</span><span class="crumb">Détail de la journée</span></nav>
<header class="hero"><div><strong>MY TRUCK MATE</strong><small>FICHE JOURNALIÈRE</small></div></header>
<div id="content"><div class="empty">Chargement de la journée…</div></div>
</main>
<script>
const KEY='truckpilote_daily_entries_v1';const $=id=>document.getElementById(id);
const icons={calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',km:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M6 12h12M9 9l-3 3 3 3M15 9l3 3-3 3"/></svg>',truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h13v12H2zM15 9h4l3 4v4h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/></svg>',box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v14H4zM4 7l8-4 8 4M12 3v18"/></svg>',lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>',fork:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v7M9 3v7M7 3v18M17 3v18M14 3c0 5 6 5 6 0"/></svg>'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function duration(a,b){if(!a||!b)return '—';let [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let n=(h2*60+m2)-(h1*60+m1);if(n<0)n+=1440;return Math.floor(n/60)+' h '+String(n%60).padStart(2,'0')}
function show(e){if(!e){$('content').innerHTML='<div class="empty">Aucune journée enregistrée à cette date.<br><a href="ma_journee.html">Saisir une journée</a></div>';return}
const d=new Date(e.date+'T12:00:00');const date=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const distance=e.kmstart!==''&&e.kmend!==''?Math.max(0,Number(e.kmend)-Number(e.kmstart)):null;
const transports=Array.isArray(e.transports)?e.transports:[];const tHtml=transports.map((t,i)=>'<div class="transport"><div class="transport-title">Transport '+(i+1)+'</div><div class="transport-grid"><div class="transport-line">'+icons.user+' Donneur d’ordre : <b>'+esc(t.donor||'—')+'</b></div><div class="transport-line">'+icons.box+' Conteneur : <b>'+esc(t.container||'—')+'</b></div><div class="transport-line">'+icons.user+' Client : <b>'+esc(t.client||'—')+'</b></div><div class="transport-line">'+icons.lock+' Plomb : <b>'+esc(t.seal||'—')+'</b></div><div class="transport-line">'+icons.truck+' Châssis : <b>'+esc(t.chassis||'—')+'</b></div><div class="transport-line">'+icons.layers+' Taille : <b>'+esc(t.size||'—')+'</b></div><div class="transport-line">'+icons.truck+' Ville : <b>'+esc(t.city||'—')+'</b></div><div class="transport-line">'+icons.fork+' Import / Export : <b>'+esc(t.io||'—')+'</b></div></div></div>').join('');
const fee=(name,yes,ico)=>'<div class="fee '+(yes?'yes':'')+'">'+ico+'<label>'+name+'</label><b>'+(yes?'Oui':'Non')+'</b></div>';
$('content').innerHTML='<div class="date">'+icons.calendar+' <span>'+esc(date.charAt(0).toLocaleUpperCase('fr-FR')+date.slice(1))+'</span></div><div class="identity"><span>'+icons.truck+' Immatriculation : <b>'+esc(e.tractor||'—')+'</b></span><span>⌖ Lieux fin de journée : <b>'+esc(e.place||'—')+'</b></span></div><section class="section"><div class="heading">'+icons.clock+' Horaires et activité</div><div class="metrics four"><div class="metric"><label>Début</label><strong>'+esc(e.start||'—')+'</strong></div><div class="metric"><label>Fin</label><strong>'+esc(e.end||'—')+'</strong></div><div class="metric"><label>Amplitude</label><strong class="accent">'+duration(e.start,e.end)+'</strong></div><div class="metric"><label>Conduite</label><strong>'+esc(e.drive||'—')+'</strong></div></div></section><section class="section"><div class="heading">'+icons.km+' Kilométrage</div><div class="metrics three"><div class="metric"><label>Km départ</label><strong>'+esc(e.kmstart?Number(e.kmstart).toLocaleString('fr-FR')+' km':'—')+'</strong></div><div class="metric"><label>Km arrivée</label><strong>'+esc(e.kmend?Number(e.kmend).toLocaleString('fr-FR')+' km':'—')+'</strong></div><div class="metric"><label class="accent">Total</label><strong class="accent">'+(distance===null?'—':distance.toLocaleString('fr-FR')+' km')+'</strong></div></div></section><section class="section"><div class="heading">'+icons.truck+' Transports ('+transports.length+')</div>'+(tHtml||'<div class="transport-line" style="padding:10px">Aucun transport renseigné</div>')+'</section><section class="section"><div class="heading">'+icons.fork+' Primes et repas</div><div class="fees">'+fee('Petit-déj.',e.breakfast,'☕')+fee('Déjeuner',e.lunch,'♧')+fee('Dîner',e.dinner,'◉')+fee('Nuit',e.night,'▰')+fee('Train',e.train,'▤')+'</div></section><div class="actions"><button class="print" onclick="window.print()">▣ Enregistrer en PDF ou imprimer</button><button class="more" onclick="location.href=\'ma_journee.html?date='+encodeURIComponent(e.date)+'\'">•••</button></div>'}
let date=new URLSearchParams(location.search).get('date');let all={};try{all=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}if(!date)date=Object.keys(all).sort().pop();show(all[date]);
</script></body></html>
