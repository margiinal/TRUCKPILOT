<svg xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="ice" x2="0" y2="1"><stop stop-color="#f5fdff"/><stop offset=".48" stop-color="#9be5ff"/><stop offset="1" stop-color="#168bd1"/></linearGradient>
 <linearGradient id="blue" x2=".15" y2="1"><stop stop-color="#78d8ff"/><stop offset=".5" stop-color="#168bd8"/><stop offset="1" stop-color="#064b89"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0a8"/><stop offset=".55" stop-color="#ffc64f"/><stop offset="1" stop-color="#c87919"/></linearGradient>
 <linearGradient id="dark" x2="0" y2="1"><stop stop-color="#347ca8"/><stop offset="1" stop-color="#092c4a"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<symbol id="day" viewBox="0 0 120 100">
  <defs>
   <linearGradient id="day-cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf4ff"/><stop offset=".28" stop-color="#36b9f4"/><stop offset=".72" stop-color="#0876c4"/><stop offset="1" stop-color="#03416f"/></linearGradient>
   <linearGradient id="day-page" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#bcecff"/></linearGradient>
   <linearGradient id="day-metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4bf"/><stop offset=".42" stop-color="#ffc64d"/><stop offset="1" stop-color="#b76a12"/></linearGradient>
   <linearGradient id="day-pen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fdff"/><stop offset=".4" stop-color="#64d8ff"/><stop offset="1" stop-color="#0872ba"/></linearGradient>
   <filter id="day-shadow" x="-40%" y="-40%" width="190%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="2" dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#day-shadow)" stroke-linejoin="round">
   <!-- Pages and visible thick lower edge -->
   <path d="M28 22 79 15 93 25 93 79 40 88 27 78Z" fill="#06365e" stroke="#031e37" stroke-width="2"/>
   <path d="m27 17 51-8 14 10v57l-52 9-13-10Z" fill="url(#day-page)" stroke="#d7f7ff" stroke-width="3"/>
   <path d="m27 17 51-8v9l-51 8Z" fill="#fff" opacity=".85"/>
   <path d="m78 9 14 10v57l-14-10Z" fill="#70c9ef" stroke="#d9f7ff" stroke-width="2"/>
   <!-- 3D blue hard cover -->
   <path d="m20 13 52-8 16 11v60l-54 9-14-11Z" fill="url(#day-cover)" stroke="#baf2ff" stroke-width="3"/>
   <path d="m20 13 52-8 16 11-54 9Z" fill="#e7fbff" opacity=".72"/>
   <path d="m34 25 43-7v48l-43 7Z" fill="url(#day-page)" stroke="#eafaff" stroke-width="2"/>
   <path d="m77 18 11-2v60l-11 2Z" fill="#075b99" opacity=".8"/>
   <!-- Binding rings -->
   <path d="m37 7 8-1 2 14-8 1Z M57 4l8-1 2 14-8 1Z" fill="url(#day-metal)" stroke="#fff2bd" stroke-width="2"/>
   <path d="m38 5 7-1 1 5-7 1Z M58 2l7-1 1 5-7 1Z" fill="#fff8d8"/>
   <!-- Paper lines -->
   <path d="m42 34 27-4M42 44l27-4M42 54l17-3" stroke="#1686c2" stroke-width="4" stroke-linecap="round"/>
   <path d="m42 34 27-4" stroke="#fff" stroke-width="1.2" opacity=".8"/>
   <!-- Gold check mark badge -->
   <circle cx="69" cy="66" r="12" fill="#064d7c" opacity=".5"/>
   <circle cx="67" cy="63" r="12" fill="url(#day-metal)" stroke="#fff0b9" stroke-width="2"/>
   <path d="m61 63 4 4 8-9" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
   <!-- Pen on right edge, raised -->
   <g transform="rotate(25 91 45)">
    <rect x="86" y="25" width="9" height="45" rx="4" fill="url(#day-pen)" stroke="#d8f7ff" stroke-width="2"/>
    <path d="M86 31h9" stroke="#fff" stroke-width="2" opacity=".9"/>
    <path d="m86 68 4.5 9 4.5-9Z" fill="url(#day-metal)" stroke="#fff0c0" stroke-width="1.5"/>
    <rect x="87" y="22" width="7" height="8" rx="2" fill="#fff" stroke="#4dcaff" stroke-width="1.5"/>
   </g>
   <!-- Specular highlights -->
   <path d="m25 17 3-1v54l-3-2Z" fill="#fff" opacity=".55"/>
   <path d="m37 27 30-5" stroke="#fff" stroke-width="1.5" opacity=".75"/>
  </g>
 </symbol>
<symbol id="week" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><rect x="14" y="20" width="72" height="58" rx="10" fill="url(#ice)" stroke="#dff9ff" stroke-width="4"/><path d="M14 34h72" stroke="#0878ba" stroke-width="8"/><path d="M31 12v19M69 12v19" stroke="#dff8ff" stroke-width="7" stroke-linecap="round"/><g fill="url(#blue)"><rect x="27" y="44" width="12" height="10" rx="3"/><rect x="47" y="44" width="12" height="10" rx="3"/><rect x="67" y="44" width="10" height="10" rx="3"/></g><rect x="27" y="62" width="12" height="8" rx="2" fill="url(#gold)"/><rect x="47" y="62" width="12" height="8" rx="2" fill="url(#blue)"/></g></symbol>
<symbol id="fees" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><rect x="13" y="22" width="74" height="52" rx="11" fill="url(#blue)" stroke="#c8f2ff" stroke-width="4"/><path d="M19 30h62v34H19z" fill="url(#dark)"/><circle cx="50" cy="47" r="17" fill="url(#gold)" stroke="#fff0b5" stroke-width="4"/><path d="M45 42h10M50 36v23" stroke="#9a5d12" stroke-width="3.5" stroke-linecap="round"/><path d="M20 18h60" stroke="#b5efff" stroke-width="4" stroke-linecap="round"/></g></symbol>
<symbol id="history" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><path d="M20 16h60v61H20z" fill="url(#ice)" stroke="#dff8ff" stroke-width="4"/><path d="M30 31h40M30 43h40M30 55h31" stroke="#12659a" stroke-width="5" stroke-linecap="round"/><path d="M30 66h22" stroke="#f6b94b" stroke-width="5" stroke-linecap="round"/><path d="M72 16v14h8" fill="none" stroke="#218ec9" stroke-width="3"/></g></symbol>
<symbol id="save" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><path d="M17 12h52l15 15v49H17z" fill="url(#ice)" stroke="#d9f7ff" stroke-width="4"/><path d="M30 13v22h39V13" fill="url(#dark)" stroke="#4cbfff" stroke-width="3"/><rect x="30" y="47" width="40" height="22" rx="4" fill="url(#gold)" stroke="#fff0b8" stroke-width="3"/><path d="M39 55h22M39 62h15" stroke="#9b641b" stroke-width="3" stroke-linecap="round"/></g></symbol>
<symbol id="profile" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><circle cx="50" cy="29" r="19" fill="url(#gold)" stroke="#fff0c5" stroke-width="4"/><path d="M17 79c2-20 14-31 33-31s31 11 33 31" fill="url(#blue)" stroke="#b9edff" stroke-width="4"/><path d="M42 28h.1M58 28h.1" stroke="#81501c" stroke-width="5" stroke-linecap="round"/></g></symbol>
<symbol id="docs" viewBox="0 0 100 90"><g filter="url(#shadow)" stroke-linejoin="round"><path d="M25 12h39l14 15v48H25z" fill="url(#ice)" stroke="#e1faff" stroke-width="4"/><path d="M64 12v17h14" fill="#d9f7ff" stroke="#46bfff" stroke-width="3"/><path d="M36 43h30M36 53h30M36 63h21" stroke="#12699e" stroke-width="5" stroke-linecap="round"/><path d="M18 25v46q0 7 8 7h39" fill="none" stroke="#4fc4ff" stroke-width="4"/></g></symbol>
</svg>