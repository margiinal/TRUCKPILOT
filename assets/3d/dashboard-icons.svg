<svg xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="ice" x2="0" y2="1"><stop stop-color="#f5fdff"/><stop offset=".48" stop-color="#9be5ff"/><stop offset="1" stop-color="#168bd1"/></linearGradient>
