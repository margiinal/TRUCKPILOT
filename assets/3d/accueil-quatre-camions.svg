<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071a31"/><stop offset=".58" stop-color="#173b59"/><stop offset="1" stop-color="#f17a32"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff4b1"/><stop offset=".35" stop-color="#ffb44d"/><stop offset="1" stop-color="#ff7a28" stop-opacity="0"/></radialGradient>
