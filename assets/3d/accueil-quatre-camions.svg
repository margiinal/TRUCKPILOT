 <linearGradient id="yellow" x2="0" y2="1"><stop stop-color="#ffd34d"/><stop offset="1" stop-color="#a85a12"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
