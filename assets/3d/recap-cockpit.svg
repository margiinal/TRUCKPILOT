<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061a2b"/><stop offset=".55" stop-color="#092d49"/><stop offset="1" stop-color="#020d19"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ff9b50"/><stop offset=".45" stop-color="#153c63"/><stop offset="1" stop-color="#031321"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#06466c"/><stop offset="1" stop-color="#020d1b"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#0079c8"/><stop offset=".5" stop-color="#00dfff"/><stop offset="1" stop-color="#0876d4"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#00cfff" stop-opacity=".4"/><stop offset="1" stop-color="#00cfff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="270" fill="url(#glass)" opacity=".8"/>
<circle cx="235" cy="165" r="115" fill="#ff9e43" opacity=".22" filter="url(#blur)"/>
<path d="M0 220 Q180 155 350 215 T700 190 L700 330 H0Z" fill="#07192a" opacity=".8"/>
<path d="M0 275 Q240 240 470 280 T850 260 L850 600 H0Z" fill="#061827"/>
<path d="M0 0 L120 0 235 600 0 600Z" fill="#020a13" opacity=".9"/>
<path d="M0 0 L42 0 170 600 120 600Z" fill="#173b55" opacity=".5"/>
<!-- cockpit dashboard -->
<path d="M40 390 Q250 300 510 375 L565 600 H0Z" fill="#020912" stroke="#0a4c70" stroke-width="10"/>
<path d="M80 410 Q260 330 470 405" fill="none" stroke="#0aa9e4" stroke-width="7" opacity=".7" filter="url(#shine)"/>
<!-- steering wheel -->
<circle cx="240" cy="390" r="180" fill="none" stroke="#02070d" stroke-width="48"/>
<circle cx="240" cy="390" r="180" fill="none" stroke="#263e50" stroke-width="14"/>
<circle cx="240" cy="390" r="90" fill="#071827" stroke="#153a55" stroke-width="12"/>
<path d="M240 300 L240 390 L125 455 M240 390 L355 455" fill="none" stroke="#263e50" stroke-width="35" stroke-linecap="round"/>
<rect x="192" y="358" width="96" height="62" rx="16" fill="#0a3554" stroke="#10bce9" stroke-width="4"/>
<path d="M212 395 l16 -18 19 18 19 -25" fill="none" stroke="#4bdfff" stroke-width="6"/>
<!-- instrument dials -->
<circle cx="440" cy="365" r="70" fill="#041321" stroke="#0b5279" stroke-width="8"/>
<circle cx="440" cy="365" r="55" fill="none" stroke="#00cfff" stroke-width="4" opacity=".8"/>
<path d="M440 365 L474 325" stroke="#7eeaff" stroke-width="6" stroke-linecap="round"/>
<circle cx="440" cy="365" r="8" fill="#00dfff"/>
<circle cx="570" cy="365" r="70" fill="#041321" stroke="#0b5279" stroke-width="8"/>
<circle cx="570" cy="365" r="55" fill="none" stroke="#00cfff" stroke-width="4" opacity=".8"/>
<path d="M570 365 L540 320" stroke="#7eeaff" stroke-width="6" stroke-linecap="round"/>
<circle cx="570" cy="365" r="8" fill="#00dfff"/>
<!-- tablet display -->
<path d="M560 155 Q560 125 595 120 L1140 120 Q1170 120 1170 155 L1170 525 Q1170 555 1135 555 L600 555 Q565 555 565 525Z" fill="#020812" stroke="#12658d" stroke-width="12"/>
<rect x="590" y="150" width="550" height="375" rx="24" fill="url(#screen)" stroke="#05bce9" stroke-width="5"/>
<ellipse cx="865" cy="350" rx="300" ry="230" fill="url(#glow)"/>
<!-- truck graphic -->
<g transform="translate(635 190)" fill="#0ebde9" stroke="#6deaff" stroke-width="4" filter="url(#shine)">
 <rect x="0" y="30" width="130" height="75" rx="8"/><path d="M130 50h55l35 38v17h-90z"/><circle cx="45" cy="115" r="17" fill="#061a2b"/><circle cx="170" cy="115" r="17" fill="#061a2b"/>
</g>
<!-- rising bars -->
<g fill="url(#cyan)" filter="url(#shine)"><rect x="870" y="260" width="36" height="65" rx="5"/><rect x="920" y="230" width="36" height="95" rx="5"/><rect x="970" y="195" width="36" height="130" rx="5"/><rect x="1020" y="160" width="36" height="165" rx="5"/></g>
<!-- route tile -->
<rect x="625" y="365" width="150" height="125" rx="16" fill="#031a2b" stroke="#087fb3" stroke-width="4"/>
<path d="M650 460 Q680 400 710 435 T750 390" fill="none" stroke="#00dfff" stroke-width="8" stroke-linecap="round"/>
<path d="M650 460 l-2 -20 m2 20 18 -3 M750 390 l-2 -20 m2 20 18 -3" stroke="#8beeff" stroke-width="5"/>
<!-- clock tile -->
<circle cx="855" cy="427" r="58" fill="#031a2b" stroke="#0ca8dd" stroke-width="5"/>
<path d="M855 389v39l30 18" fill="none" stroke="#8cecff" stroke-width="8" stroke-linecap="round"/>
<!-- calendar tile -->
<rect x="960" y="375" width="140" height="112" rx="14" fill="#031a2b" stroke="#0ca8dd" stroke-width="5"/>
<path d="M960 407h140 M992 365v24 M1068 365v24" stroke="#8cecff" stroke-width="9" stroke-linecap="round"/>
<g fill="#00cfff"><rect x="982" y="425" width="20" height="17" rx="3"/><rect x="1017" y="425" width="20" height="17" rx="3"/><rect x="1052" y="425" width="20" height="17" rx="3"/><rect x="982" y="455" width="20" height="17" rx="3"/><rect x="1017" y="455" width="20" height="17" rx="3"/></g>
<path d="M1050 468l15 15 30 -35" fill="none" stroke="#9df5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M0 575 Q350 540 600 575 T1200 560" fill="none" stroke="#00cfff" stroke-width="5" opacity=".65" filter="url(#shine)"/>
</svg>