<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="400" viewBox="0 0 1000 400">
<defs>
 <clipPath id="clip"><rect x="4" y="4" width="992" height="392" rx="38"/></clipPath>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00101d" stop-opacity="0"/><stop offset=".43" stop-color="#00101d" stop-opacity=".12"/><stop offset=".62" stop-color="#00101d" stop-opacity=".82"/><stop offset="1" stop-color="#00101d" stop-opacity=".97"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05b9f2"/><stop offset="1" stop-color="#36eaff"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#clip)">
 <image xlink:href="recap-cockpit.webp" href="recap-cockpit.webp" x="0" y="0" width="1000" height="400" preserveAspectRatio="xMidYMid slice"/>
 <rect width="1000" height="400" fill="url(#shade)"/>
 <g text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="900">
  <text x="950" y="185" font-size="58" fill="#ffffff" stroke="#061b2b" stroke-width="2" paint-order="stroke" filter="url(#glow)">Mon</text>
  <text x="950" y="250" font-size="58" fill="url(#cyan)" stroke="#061b2b" stroke-width="2" paint-order="stroke" filter="url(#glow)">récapitulatif</text>
  <text x="950" y="310" font-size="27" font-weight="700" fill="#f4fbff" stroke="#061b2b" stroke-width="1.2" paint-order="stroke">Mes kilomètres et mon</text>
  <text x="950" y="345" font-size="27" font-weight="700" fill="#f4fbff" stroke="#061b2b" stroke-width="1.2" paint-order="stroke">temps de travail</text>
 </g>
</g>
<rect x="4" y="4" width="992" height="392" rx="38" fill="none" stroke="#08c7f7" stroke-width="7" filter="url(#glow)"/>
</svg>