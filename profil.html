<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b46"><title>Mon profil — TruckPilote</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#172536;font:16px system-ui,Arial}.head{background:#102b46;color:white;padding:22px}.head a{color:white;text-decoration:none}.box{max-width:560px;margin:22px auto;padding:0 15px}.card{background:white;border:1px solid #dce5ed;border-radius:17px;padding:20px}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd7e2;border-radius:10px;font:16px system-ui}button{width:100%;padding:14px;border:0;border-radius:11px;background:#1769aa;color:white;font-weight:750;font-size:15px;margin-top:20px}.hint{font-size:12px;color:#66788a;line-height:1.5}</style></head><body><header class="head"><a href="index.html">← Retour à TruckPilote</a><h2>Mon profil chauffeur</h2></header><main class="box"><form class="card" id="form"><label for="firstname">Prénom</label><input id="firstname" autocomplete="given-name"><label for="lastname">Nom</label><input id="lastname" autocomplete="family-name"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="email"><label for="phone">Téléphone (facultatif)</label><input id="phone" type="tel" autocomplete="tel"><button>Enregistrer mon profil</button><p class="hint">Ces informations sont enregistrées uniquement sur cet appareil dans cette première version. Aucun compte en ligne n'est encore créé.</p></form></main><script>const keys=['firstname','lastname','email','phone'];const p=JSON.parse(localStorage.getItem('truckpilote_profile')||'{}');keys.forEach(k=>document.getElementById(k).value=p[k]||'');document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const out={};keys.forEach(k=>out[k]=document.getElementById(k).value.trim());localStorage.setItem('truckpilote_profile',JSON.stringify(out));location.href='index.html'});</script></body></html>
